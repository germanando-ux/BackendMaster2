services:
  postgres:
    image: postgres:17
    container_name: bm2-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: bm2_pass_2026
      POSTGRES_DB: backendmaster2
    ports:
      - "5432:5432"
    volumes:
      - bm2_pgdata:/var/lib/postgresql/data

volumes:
  bm2_pgdata: